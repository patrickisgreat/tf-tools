name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.15.6"
  # Every module, example and environment runs its own `terraform init`. Without
  # a shared plugin cache each one downloads the AWS provider again and the
  # runner fills its disk ("no space left on device") once there are enough
  # directories. The cache keeps one copy and symlinks it into each .terraform.
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  # Lets init populate a fresh lock file from the cache; the modules' permissive
  # constraints mean most directories carry no lock file.
  TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "1"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive

  catalog:
    name: module catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify README catalog matches modules/**/metadata.yaml
        run: python3 scripts/gen_catalog.py --check

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init (no backend) + validate every module and example
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          dirs=$(find modules environments -type f -name '*.tf' \
            -exec dirname {} \; | sort -u)
          for d in $dirs; do
            if [ -f "$d/.validate-skip" ]; then
              echo "::notice::skipping $d (.validate-skip present)"
              continue
            fi
            echo "::group::validate $d"
            ( cd "$d" && terraform init -backend=false -input=false -no-color \
              && terraform validate -no-color )
            echo "::endgroup::"
          done

  test:
    name: terraform test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Run every module test suite against mocked providers
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          dirs=$(find modules -type d -name tests -exec dirname {} \; | sort -u)
          for d in $dirs; do
            echo "::group::test $d"
            ( cd "$d" && terraform init -backend=false -input=false -no-color >/dev/null \
              && terraform test -no-color )
            echo "::endgroup::"
          done

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive

  security:
    name: trivy config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          # Report findings without failing the build (tune as the repo matures).
          exit-code: "0"
